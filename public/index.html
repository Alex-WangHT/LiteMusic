<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiteMusic · 本地播放列表</title><link rel="stylesheet" href="/style.css"><script type="module" src="/client.js"></script></head>
<body><main><header><span class="badge">LITEMUSIC</span><h1>本地音乐播放器</h1><p>BV 列表仅保存在云端，音频由本地请求 B 站。</p></header>
<section class="queue-panel" aria-labelledby="library-title"><div class="section-title"><h2 id="library-title">播放列表<span id="queue-count">0 首</span></h2><button id="close-list" class="queue-icon" aria-label="关闭播放列表" hidden>×</button></div>
<div class="playlist-picker"><label>播放列表<select id="playlist-select"></select></label><input id="playlist-name" maxlength="80" placeholder="新列表名称"><button id="playlist-create">新建列表</button><button id="playlist-delete" class="secondary">删除当前列表</button></div><div class="queue-toolbar"><button id="play-all" class="queue-all">▶ 播放全部</button><button id="queue-add" class="secondary">＋ 添加 BV</button><button id="refresh" aria-label="刷新列表" title="刷新列表">↻</button></div>
<details id="connection" class="card"><summary>云端连接设置</summary><form id="connection-form"><label>云端地址<input id="cloud-url" type="url" required></label><button>连接并同步</button></form></details><details id="add-bv" class="card add-bv"><summary>添加 BV 到播放列表</summary><form id="form"><label for="video-input">BV 号或视频链接</label><div class="submit"><input id="video-input" required maxlength="2048" placeholder="BV1zNGhzeEK4"><button id="load">添加到列表</button></div></form></details>
<p id="library-message" role="status" aria-live="polite"></p><div class="queue-scroll"><div class="queue-columns"><span>#</span><span>歌曲 / BV</span><span></span></div><div id="favorites"></div></div></section>
<p id="message" role="status" aria-live="polite"></p><section id="player" class="card" hidden><h2 id="title"></h2><p id="author"></p><label for="pages">分 P</label><select id="pages"></select><audio id="audio" controls preload="none"></audio><div class="actions"><button id="reload" class="secondary">重新获取音频</button><a id="source" target="_blank" rel="noopener noreferrer">在 B 站打开</a></div></section>
</main></body></html>
