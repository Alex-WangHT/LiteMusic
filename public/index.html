<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LitePlayer · B 站音频</title><link rel="stylesheet" href="/style.css"><script type="module" src="/client.js"></script></head>
<body><main>
<header><span class="badge">LITEPLAYER · BILIBILI</span><h1>用 BV 号听音频</h1><p>输入视频链接或 BV 号，选择分 P 后播放。</p></header>
<form id="form"><label for="video-input">BV 号或视频链接</label><div class="submit"><input id="video-input" required maxlength="2048" placeholder="BV1EAYszPEP9"><button id="load">获取音频</button></div><div class="actions"><button id="save-input" type="button" class="secondary">直接收藏 BV</button></div><p class="hint">支持公开、无需登录且提供独立音轨的视频。无法解析时也可直接收藏 BV。</p></form>
<p id="message" role="status" aria-live="polite"></p>
<section id="player" class="card" hidden><h2 id="title"></h2><p id="author"></p><label for="pages">分 P</label><select id="pages"></select><audio id="audio" controls preload="none"></audio><div class="actions"><button id="save">收藏当前分 P</button><button id="reload" class="secondary">重新获取音频</button><a id="source" target="_blank" rel="noopener noreferrer">在 B 站打开</a></div></section>
<section aria-labelledby="library-title"><div class="section-title"><h2 id="library-title">我的收藏</h2><button id="refresh" class="secondary">刷新收藏</button></div><details class="card"><summary>收藏密钥与跨设备同步</summary><p class="hint">收藏保存在云端 D1，只有持有相同密钥的设备可查看和修改。请备份密钥；清除浏览器数据后需要重新输入。不要分享给他人。</p><label for="library-key">私人收藏密钥</label><input id="library-key" type="password" autocomplete="off" spellcheck="false"><div class="actions"><button id="apply-key" class="secondary">使用此密钥</button><button id="copy-key" class="secondary">复制密钥</button></div></details><p id="library-message" role="status" aria-live="polite"></p><div id="favorites"></div></section>
</main></body></html>
